<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weiterleitung | Beemaster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.7;
            color: #333;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d4b8 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        header {
            text-align: center;
            padding: 3rem 0;
            border-bottom: 2px solid #d4a574;
            margin-bottom: 2rem;
        }
        .app-name {
            font-size: 2.5rem;
            font-weight: 700;
            color: #8b4513;
            margin-bottom: 0.5rem;
        }
        .app-name span {
            color: #f5a623;
        }
        .card {
            background: #fff;
            border: 1px solid #d4a574;
            border-radius: 12px;
            padding: 2.5rem;
            margin: 2rem auto;
            max-width: 560px;
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.1);
        }
        .card h1 {
            color: #8b4513;
            font-size: 1.6rem;
            margin-bottom: 0.75rem;
        }
        .card p {
            margin-bottom: 1.25rem;
        }
        .btn {
            display: inline-block;
            background: #f5a623;
            color: #5b2f0e;
            font-weight: 700;
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            margin: 0.5rem 0.25rem;
            border: 1px solid #d4941f;
        }
        .btn.secondary {
            background: #fff;
            color: #8b4513;
            border: 1px solid #d4a574;
        }
        .btn:active {
            transform: translateY(1px);
        }
        .muted {
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="app-name">Bee<span>master</span></div>
    </header>
    <div class="container">
        <div class="card" id="authCard">
            <h1 id="title">Fast geschafft</h1>
            <p id="message">Öffne die Beemaster-App, um deinen Vorgang abzuschließen.</p>
            <p>
                <a class="btn" id="openApp" href="#">Beemaster-App öffnen</a>
            </p>
            <p class="muted" id="hint">Falls die App nicht automatisch startet, tippe erneut auf den Button. Die App muss installiert sein.</p>
        </div>
        <div class="card" id="notFoundCard" style="display:none">
            <h1>Seite nicht gefunden</h1>
            <p>Diese Adresse existiert nicht.</p>
            <p><a class="btn secondary" href="/">Zur Startseite</a></p>
        </div>
    </div>
    <script>
        (function () {
            var path = window.location.pathname;
            var isAuthPath = path === '/auth/callback' || path === '/payment-return';

            if (!isAuthPath) {
                document.getElementById('authCard').style.display = 'none';
                document.getElementById('notFoundCard').style.display = 'block';
                return;
            }

            var target = path + window.location.search + window.location.hash;
            var openApp = document.getElementById('openApp');
            openApp.href = 'https://beemaster-app.de' + target;

            if (window.sessionStorage.getItem('beemaster_app_link_attempted')) {
                openApp.style.display = 'none';
                document.getElementById('hint').textContent =
                    'Die App hat nicht geöffnet. Bitte installiere die Beemaster-App aus dem Google Play Store und tippe den Link in der E-Mail erneut an.';
                var play = document.createElement('a');
                play.className = 'btn';
                play.href = 'https://play.google.com/store/apps/details?id=com.beemaster';
                play.textContent = 'Im Google Play Store anzeigen';
                openApp.parentNode.insertBefore(play, openApp.nextSibling);
                return;
            }

            openApp.addEventListener('click', function () {
                window.sessionStorage.setItem('beemaster_app_link_attempted', '1');
            });
        })();
    </script>
</body>
</html>
